name: sc-audit
channels:
  - conda-forge
  - bioconda
  - defaults
dependencies:
  - python>=3.9
  - pip
  # Scientific computing
  - numpy>=1.24.0
  - pandas>=2.0.0
  - scipy>=1.10.0
  # Single-cell analysis
  - scanpy>=1.9.0
  - anndata>=0.9.0
  # Visualization
  - matplotlib>=3.7.0
  - seaborn>=0.12.0
  # Testing and development
  - pytest>=7.4.0
  - pytest-cov>=4.1.0
  - black>=23.0.0
  # Pip dependencies (not available in conda)
  - pip:
    - anthropic>=0.34.0
    - pydantic>=2.0.0
    - ruff>=0.1.0
